name: Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  test-and-build:
    name: Build & Lint Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run Linter & Type Check
        run: npm run lint

      - name: Build Web Application & Express Server
        run: npm run build

      - name: Test Neutralino Desktop Bundle
        run: npm run build:neu

      - name: Upload Mac ARM64 Binary
        uses: actions/upload-artifact@v4
        with:
          name: RestStudio-Mac-ARM64
          path: dist/reststudio/RestStudio-Mac-ARM64.zip
          if-no-files-found: ignore

      - name: Upload Mac x64 Binary
        uses: actions/upload-artifact@v4
        with:
          name: RestStudio-Mac-x64
          path: dist/reststudio/RestStudio-Mac-x64.zip
          if-no-files-found: ignore

      - name: Upload Mac Universal Binary
        uses: actions/upload-artifact@v4
        with:
          name: RestStudio-Mac-Universal
          path: dist/reststudio/RestStudio-Mac-Universal.zip
          if-no-files-found: ignore

      - name: Upload Windows x64 Exe
        uses: actions/upload-artifact@v4
        with:
          name: RestStudio-Windows-x64-Exe
          path: dist/reststudio/RestStudio-Windows-x64.exe
          if-no-files-found: ignore

      - name: Upload Windows x64 Zip
        uses: actions/upload-artifact@v4
        with:
          name: RestStudio-Windows-x64-Zip
          path: dist/reststudio/RestStudio-Windows-x64.zip
          if-no-files-found: ignore

      - name: Upload Linux x64
        uses: actions/upload-artifact@v4
        with:
          name: RestStudio-Linux-x64
          path: dist/reststudio/RestStudio-Linux-x64
          if-no-files-found: ignore

      - name: Upload Linux ARM64
        uses: actions/upload-artifact@v4
        with:
          name: RestStudio-Linux-ARM64
          path: dist/reststudio/RestStudio-Linux-ARM64
          if-no-files-found: ignore

      - name: Upload Linux ARMhf
        uses: actions/upload-artifact@v4
        with:
          name: RestStudio-Linux-ARMhf
          path: dist/reststudio/RestStudio-Linux-ARMhf
          if-no-files-found: ignore



