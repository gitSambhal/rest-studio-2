name: Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    name: Build & Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
          - os: macos-latest
            name: macos
          - os: windows-latest
            name: windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: |
          node -e "const fs = require('fs'); fs.rmSync('package-lock.json', {force: true});"
          npm install --include=optional

      - name: Run Linter & Type Check (Linux only)
        if: matrix.name == 'linux'
        run: npm run lint

      - name: Build Web Application & Express Server
        run: npm run build

      - name: Build Neutralino Desktop Bundle
        run: npm run build:neu

      - name: Upload Linux Binaries
        if: matrix.name == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: RestStudio-Linux-Binaries
          path: |
            dist/reststudio/RestStudio-Linux-x64
            dist/reststudio/RestStudio-Linux-ARM64
            dist/reststudio/RestStudio-Linux-ARMhf

      - name: Upload macOS Binaries
        if: matrix.name == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: RestStudio-macOS-Binaries
          path: |
            dist/reststudio/RestStudio-Mac-ARM64.zip
            dist/reststudio/RestStudio-Mac-x64.zip
            dist/reststudio/RestStudio-Mac-Universal.zip

      - name: Upload Windows Binaries
        if: matrix.name == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: RestStudio-Windows-Binaries
          path: |
            dist/reststudio/RestStudio-Windows-x64.exe
            dist/reststudio/RestStudio-Windows-x64.zip
