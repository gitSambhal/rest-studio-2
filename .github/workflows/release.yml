name: Release Desktop Applications

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      draft:
        description: 'Publish as Draft'
        type: boolean
        default: false
      prerelease:
        description: 'Publish as Prerelease'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build Release Binaries (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
          - os: macos-latest
            name: macos
          - os: windows-latest
            name: windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Lint and Typecheck (Linux only)
        if: matrix.name == 'linux'
        run: npm run lint

      - name: Build Web App & Desktop Binaries
        run: npm run build:neu

      - name: Upload Linux Binaries
        if: matrix.name == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: RestStudio-Linux-Binaries
          path: |
            dist/reststudio/RestStudio-Linux-x64
            dist/reststudio/RestStudio-Linux-ARM64
            dist/reststudio/RestStudio-Linux-ARMhf

      - name: Upload macOS Binaries
        if: matrix.name == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: RestStudio-macOS-Binaries
          path: |
            dist/reststudio/RestStudio-Mac-ARM64.zip
            dist/reststudio/RestStudio-Mac-x64.zip
            dist/reststudio/RestStudio-Mac-Universal.zip

      - name: Upload Windows Binaries
        if: matrix.name == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: RestStudio-Windows-Binaries
          path: |
            dist/reststudio/RestStudio-Windows-x64.exe
            dist/reststudio/RestStudio-Windows-x64.zip

  release:
    name: Create GitHub Release & Upload Assets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-duplicates: true

      - name: List Downloaded Artifacts
        run: |
          find release-artifacts -type f

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v1.0.0' }}
          name: RestStudio Desktop ${{ github.event.inputs.version || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v1.0.0' }}
          target_commitish: ${{ github.sha }}
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            release-artifacts/**/*.zip
            release-artifacts/**/*.exe
            release-artifacts/**/RestStudio-Linux-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
