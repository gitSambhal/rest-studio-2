name: Release & Desktop Binaries

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      draft:
        description: 'Publish as Draft'
        type: boolean
        default: false
      prerelease:
        description: 'Publish as Prerelease'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build & Release All Desktop Binaries
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: |
          node -e "const fs = require('fs'); fs.rmSync('package-lock.json', {force: true});"
          npm install --include=optional

      - name: Run Linter & Type Check
        run: npm run lint

      - name: Build Web App & All Desktop Binaries
        run: npm run build:neu

      - name: List Generated Binaries
        run: |
          echo "=== Generated files in dist/reststudio ==="
          find dist/reststudio -type f -ls

      - name: Upload Linux Binaries
        uses: actions/upload-artifact@v4
        with:
          name: RestStudio-Linux-Binaries
          path: dist/reststudio/RestStudio-Linux-*
          if-no-files-found: warn

      - name: Upload macOS Archives
        uses: actions/upload-artifact@v4
        with:
          name: RestStudio-macOS-Archives
          path: dist/reststudio/RestStudio-Mac-*.zip
          if-no-files-found: warn

      - name: Upload Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: RestStudio-Windows-Executable
          path: dist/reststudio/RestStudio-Windows-x64.exe
          if-no-files-found: warn

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'nightly' }}
          name: RestStudio Desktop ${{ github.event.inputs.version || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'Nightly Build' }}
          overwrite_files: true
          target_commitish: ${{ github.sha }}
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || github.ref_name == 'main' || true }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            dist/reststudio/RestStudio-Linux-*
            dist/reststudio/RestStudio-Mac-*.zip
            dist/reststudio/RestStudio-Windows-x64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

