name: Release Desktop Applications

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      draft:
        description: 'Publish as Draft'
        type: boolean
        default: false
      prerelease:
        description: 'Publish as Prerelease'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-neutralino-release:
    name: Build Neutralino Multi-Platform Desktop Executables
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Lint and Typecheck
        run: npm run lint

      - name: Build Web App & Desktop Binaries
        run: npm run build:neu

      - name: Verify Built Release Artifacts
        run: |
          echo "=== Built Release Artifacts in dist/reststudio/ ==="
          ls -lh dist/reststudio/

      - name: Upload Build Artifacts to Actions Run
        uses: actions/upload-artifact@v4
        with:
          name: reststudio-desktop-binaries
          path: dist/reststudio/*
          retention-days: 90

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v1.0.0' }}
          name: RestStudio Desktop ${{ github.event.inputs.version || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v1.0.0' }}
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            dist/reststudio/RestStudio-Mac-ARM64.zip
            dist/reststudio/RestStudio-Mac-x64.zip
            dist/reststudio/RestStudio-Mac-Universal.zip
            dist/reststudio/RestStudio-Windows-x64.exe
            dist/reststudio/RestStudio-Windows-x64.zip
            dist/reststudio/RestStudio-Linux-x64
            dist/reststudio/RestStudio-Linux-ARM64
            dist/reststudio/RestStudio-Linux-ARMhf
            dist/reststudio/resources.neu
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-tauri-release:
    name: Build Tauri Native Installers (${{ matrix.platform }})
    needs: build-neutralino-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install npm dependencies
        run: npm ci || npm install

      - name: Build Web Frontend
        run: npm run build

      - name: Build Tauri App & Package
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.version || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v1.0.0' }}
          releaseName: 'RestStudio Desktop ${{ github.event.inputs.version || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v1.0.0' }}'
          releaseBody: 'RestStudio Native Desktop Applications built with NeutralinoJS & Tauri'
          releaseDraft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}

